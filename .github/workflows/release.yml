name: Mål-byg aarch64 RPM og GitHub Release

# Funktion 23 (distributionsartefakt_rpm): mål-byg i en sandkasse med
# Sailfish SDK kører her på GitHubs runners — ikke i stokastikerens egen
# sandkasse. På tags v*.*.* (eller manuelt via workflow_dispatch) bygges
# .rpm, værtsløkken (QtTest + manifest-/spejlkontroller) køres, og ved tag
# oprettes en GitHub Release med .rpm vedhæftet via GITHUB_TOKEN
# (contents: write). Ingen .rpm lægges nogensinde i git-træet
# (depot-reglen ingen_rpm_eller_log_i_depotet gælder stadig).
# Samme mønster som storefyr/Skrynja v0.9.x.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  SAILFISH_RELEASE: '4.5.0.18'

jobs:
  målbyg-rpm:
    name: "Mål-byg aarch64 RPM i Sailfish SDK"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Udgivelsesversion fra tag
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Bygger version: $VERSION"

      - name: Opdater spec-version
        run: |
          sed -i "s/^Version:.*/Version: ${{ steps.version.outputs.version }}/" rpm/harbour-skrynja-2.spec
          grep "^Version:" rpm/harbour-skrynja-2.spec

      - name: Byg RPM (aarch64, Sailfish SDK via docker)
        uses: R1tschY/sailfish-build-rpm@v1
        with:
          arch: aarch64
          release: ${{ env.SAILFISH_RELEASE }}
          fix-version: false

      - name: Vis byggede pakker
        run: ls -lh RPMS/

      - name: Upload RPM-artefakt
        uses: actions/upload-artifact@v4
        with:
          name: rpm-aarch64
          path: RPMS/*.rpm

  værtsløkke:
    name: "Værtsløkke: QtTest-suite + kontroller"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Qt 5-værktøjskæde
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qtbase5-dev qtbase5-dev-tools qt5-qmake qtdeclarative5-dev make g++

      - name: Byg og kør parrede tests
        run: |
          export PATH=/usr/lib/qt5/bin:$PATH
          cd tests
          qmake tests.pro
          make -j2
          ./tst_skrynja_2

      - name: Manifest- og spejlkontroller
        run: |
          python3 tjek_manifest_parrede_tests.py
          python3 tjek_plan_manifest_spejl.py

  udgiv-release:
    name: "Opret GitHub Release med .rpm vedhæftet"
    needs: [målbyg-rpm, værtsløkke]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hent RPM-artefakt
        uses: actions/download-artifact@v4
        with:
          path: rpms

      - name: Vis vedhæftede pakker
        run: find rpms/ -name "*.rpm" ! -name "*-debuginfo-*" ! -name "*-debugsource-*"

      - name: Opret GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            rpms/rpm-aarch64/*.rpm
          draft: false
          prerelease: false
